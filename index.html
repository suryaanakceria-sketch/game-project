<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        BLACK SERPENT FPS
    </title>


    <!-- =========================
         CSS SYSTEM
    ========================== -->

    <link rel="stylesheet" href="css/launcher.css">

    <link rel="stylesheet" href="css/animation.css">

    <link rel="stylesheet" href="css/responsive.css">


</head>



<body>


<!-- =========================
     LOADING SCREEN
========================== -->


<div id="loading-screen">


    <div class="loading-container">


        <h2>
            BLACK SERPENT
        </h2>


        <div class="loading-bar">

            <span></span>

        </div>


        <p>
            INITIALIZING SYSTEM...
        </p>


    </div>


</div>





<!-- =========================
     MAIN LAUNCHER
========================== -->


<main class="launcher">



    <!-- BACKGROUND EFFECT -->

    <div class="background-overlay"></div>




    <!-- =====================
         LOGO AREA
    ====================== -->


    <section class="logo-section">


        <h1 class="game-logo">

            BLACK

            <span>
                SERPENT
            </span>


        </h1>



        <p class="subtitle">

            TACTICAL FPS EXPERIENCE

        </p>


    </section>






    <!-- =====================
         MENU PANEL
    ====================== -->


    <section class="menu-panel">


        <button 
        class="menu-button play-button"
        id="play-btn">


            PLAY NOW


        </button>





        <button 
        class="menu-button"
        id="loadout-btn">


            LOADOUT


        </button>





        <button 
        class="menu-button"
        id="setting-btn">


            SETTINGS


        </button>





        <button 
        class="menu-button"
        id="exit-btn">


            EXIT


        </button>



    </section>







    <!-- =====================
         VERSION INFO
    ====================== -->


    <footer class="version">


        BLACK SERPENT FPS

        <br>

        VERSION 1.0.0


    </footer>





</main>






<!-- =========================
     JAVASCRIPT SYSTEM
========================== -->


<script src="js/loading.js"></script>

<script src="js/audio.js"></script>

<script src="js/ui.js"></script>

<script src="js/engine.js"></script>



</body>

</html>
